name: collect-videos
on:
  schedule:
    - cron: '0 21 * * *'   # 한국 06:00
    - cron: '0 9 * * *'    # 한국 18:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect.py
      - name: Commit videos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: videos.json 갱신"
          git push
